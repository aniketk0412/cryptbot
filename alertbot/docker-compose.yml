version: '3.8'

services:
  alertbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candela-futures-bot
    restart: unless-stopped
    ports:
      - "1000:1000"
    environment:
      - PORT=1000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
